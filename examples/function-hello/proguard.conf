# ProGuard, SHRINK ONLY (docs/function-runner-plan.md §8): Jackson derives JSON member
# names from Java member names, and stack traces must stay readable, so this build never
# renames or restructures code — it only removes what nothing reaches. A missing keep
# rule here fails at RUNTIME (the host's JvmFunctionLoader refusing to load, or a
# NoSuchMethodError deep in Jackson), not at build time — which is exactly why
# ShrunkJarTest runs against the jar THIS file produced, not the pre-shrink one.
-dontobfuscate
-dontoptimize

# The JDK's own classes, as ProGuard library jars — the manual's own documented form
# (`<java.home>` is text ProGuard substitutes with the running JVM's `java.home` system
# property; this whole line, unlike a pom.xml `<lib>` entry, is read by ProGuard as raw
# text, so the token survives to reach it un-expanded by Maven).
#
# ENVIRONMENT BLOCKER (reported, not silently worked around — see the module's final
# report and pom.xml's own comment on this plugin): this line is exactly what
# `docs/function-runner-plan.md` §8 / ProGuard's own manual calls for, and matches
# every documented example of shrinking JDK 9+ code. It fails on THIS build's own JDK
# (confirmed: a mise-managed Temurin 25.0.4.1, but also the raw, official upstream
# Adoptium tarball for macOS/aarch64 AND linux/x64, downloaded and inspected directly)
# because that JDK ships NO `jmods/` directory at all — plausibly JEP 493 fallout
# ("Linking Run-Time Images without JMODs": jlink itself no longer needs jmods, so
# recent Temurin builds have stopped shipping them). proguard-core has no fallback
# that reads a JEP 220 run-time image (`lib/modules`) directly — confirmed by
# inspecting proguard-core 9.4.0 and 9.1.10 for any `jrt:`/run-time-image handling:
# there is none. A JDK distribution that still ships `jmods/` (this repo's own
# GraalVM install does) makes this line work unchanged.
-libraryjars <java.home>/jmods/java.base.jmod
-libraryjars <java.home>/jmods/java.sql.jmod
-libraryjars <java.home>/jmods/java.logging.jmod
-libraryjars <java.home>/jmods/java.naming.jmod
-libraryjars <java.home>/jmods/java.xml.jmod

# Attributes a shrink-only build still needs (function-runner-plan.md §8's list,
# verbatim): annotations (Jackson's own + anything a function author adds),
# generic signatures, inner-class/enclosing-method linkage for nested/lambda classes,
# the Record attribute records depend on for their canonical constructor and
# component accessors, and MethodParameters (Jackson can bind constructor
# parameters by name without an explicit @JsonProperty when this is kept, and stack
# traces referencing lambdas read cleanly).
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod,Record,MethodParameters

# ── the manifest entrypoint ──────────────────────────────────────────────────────
# The host loads this class by NAME (manifest.json's "entrypoint") via reflection
# (JvmFunctionLoader#load: Class.forName + getDeclaredConstructor().newInstance()) and
# then calls init()/handle()/stop() through the `io.flowcatalyst.function.Function`
# INTERFACE — a library type from ProGuard's point of view (function-api is
# `-libraryjars`, never `-injars`). ProGuard cannot see across that boundary: a call
# a LIBRARY class makes into a PROGRAM class's interface-typed field is invisible to
# its reachability analysis. Confirmed empirically while building this file — keeping
# only the constructor here left `init`/`handle`/`stop` stripped from the shrunk jar
# (`javap` on the result showed a class with a constructor and nothing else), which
# is exactly the `ENTRYPOINT_NOT_A_FUNCTION`-shaped failure a member-scoped keep
# rule invites; `{ *; }` keeps the whole small entrypoint class, member renaming is
# already off (`-dontobfuscate`), so this costs nothing extra. THIS is the rule
# ShrunkJarTest's mutation deletes — see the module's final report for the observed
# failure.
-keep class io.flowcatalyst.example.hello.HelloFunction {
    *;
}

# ── classes Jackson binds by reflection ──────────────────────────────────────────
# GreetingPayload is only ever touched through ObjectMapper#writeValueAsBytes —
# nothing in HelloFunction calls its record accessors (name()/greeting()) directly,
# so a shrink-only pass would otherwise remove them as unreachable even with
# obfuscation off (shrinking and obfuscation are separate passes).
-keepclassmembers class io.flowcatalyst.example.hello.GreetingPayload {
    *;
}
-keep class io.flowcatalyst.example.hello.GreetingPayload

# ── ServiceLoader-registered modules ─────────────────────────────────────────────
# jackson-databind discovers optional tools.jackson.databind.JacksonModule
# implementations via META-INF/services (java.util.ServiceLoader) — invisible to
# ProGuard's static call-graph analysis the same way reflection is.
-keep class * implements tools.jackson.databind.JacksonModule

# ── enum values()/valueOf(String) ────────────────────────────────────────────────
# Synthesised by javac, called reflectively by frameworks (Jackson's enum
# (de)serialisers included) — invisible to static analysis for the same reason.
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# jackson-databind carries many OPTIONAL soft integrations (javax.xml.bind, joda-time,
# Guava, and more) reached only via reflection or an absent-at-runtime class check —
# this function never touches any of them, and none of those optional 3rd-party
# libraries is on this build's classpath to resolve against. Without this, the "can't
# find referenced class" WARNINGs those paths trigger fail the build outright (ProGuard
# refuses to proceed past unresolved warnings unless told to); shrinking (removal) is
# unaffected by a warning being present or absent, so this does not hide a real defect
# in the KEPT, reachable code this function actually runs.
-dontwarn tools.jackson.databind.ext.**
-dontwarn tools.jackson.dataformat.**
-dontwarn com.fasterxml.jackson.**
-dontwarn javax.xml.**
-dontwarn javax.activation.**
-dontwarn org.w3c.dom.**

# `java.lang.invoke.MethodHandle#invokeExact` is a signature-polymorphic method (JVMS
# §2.9.3): the JVM synthesises the exact overload at each call site, so no such method
# is ever literally present in `MethodHandle.class`'s own method table for ProGuard's
# static library model to find — a known false positive for any MethodHandle-based fast
# accessor, verified directly against jackson-databind's own (four) call sites, not
# blanket-suppressed: `-dontwarn` here names the four owning classes, not a wildcard.
-dontwarn tools.jackson.databind.deser.impl.MethodProperty
-dontwarn tools.jackson.databind.introspect.AnnotatedConstructor
-dontwarn tools.jackson.databind.introspect.AnnotatedMethod
-dontwarn tools.jackson.databind.ser.BeanPropertyWriter
