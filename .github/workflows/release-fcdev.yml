name: Release fcdev

# Mirrors ../flowcatalyst-go/.github/workflows/release-fcdev.yml: publishes the
# `fcdev` developer binary as downloadable GitHub Release assets, named and
# checksummed the way `io.flowcatalyst.fcdev.UpgradeCommand` expects so that
# `fcdev upgrade` can find and verify them.
#
# Tag/repo ownership (resolved 2026-09-24, `docs/spec/fcdev-release-0.9.md`
# §1/§2): THIS repository (flowcatalyst-javalin) owns the `fcdev/v*` tag
# stream from here on — `UpgradeCommand.DEFAULT_REPO` points at
# `flowcatalyst/flowcatalyst-javalin`, and this is the workflow that
# publishes for it. The Go repository's own `release-fcdev.yml` publishes
# under the SAME tag prefix and the SAME asset filenames — running both
# against the same `fcdev/v*` tag would be two different binaries fighting
# over one release's assets, so **the Go repository's `release-fcdev.yml`
# must be disabled** (an owner action, not something this file can enforce);
# users still on the Go fcdev either reinstall from here or point
# `FC_DEV_UPGRADE_REPO` at the Go repository to keep using it.
#
# The `meta` job below fails the release outright if the pushed tag's
# version does not match `fcdev/src/main/resources/VERSION` at that ref —
# a binary reporting a version other than the one its own release was cut
# under would break `fcdev upgrade`'s semver comparison silently.
#
# Structural difference from Go's release-fcdev.yml: Go cross-compiles all
# five targets (darwin/linux amd64+arm64, windows amd64) on one Linux
# runner. GraalVM native-image cannot cross-compile, so this workflow uses a
# build matrix of native runners (one job run per target platform) and a
# separate `release` job that collects every platform's archive and
# publishes them together. Windows is omitted: a GraalVM Windows native
# build needs MSVC build-tools setup this repo has never established (unlike
# ci.yml's `native` job, which only covers Linux amd64/arm64 + macOS
# arm64) — inventing an untested Windows toolchain here would be worse than
# leaving the platform out for now.

on:
  push:
    tags:
      - "fcdev/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. fcdev/v0.4.17"
        required: true

permissions:
  contents: read

jobs:
  meta:
    name: Resolve tag + version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^fcdev/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' does not match fcdev/vX.Y.Z[-suffix]" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#fcdev/v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The binary embeds fcdev/src/main/resources/VERSION
      # (io.flowcatalyst.fcdev.Version) and `fcdev upgrade` compares that
      # embedded version against the release it finds — a tag that does not
      # match VERSION at this ref would ship a binary reporting a version
      # different from the release it came from.
      - name: Verify the tag matches VERSION
        id: meta
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < fcdev/src/main/resources/VERSION)"
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag fcdev/v$TAG_VERSION does not match fcdev/src/main/resources/VERSION ($FILE_VERSION) at this ref" >&2
            exit 1
          fi
          echo "tag=${{ steps.tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build fcdev native (${{ matrix.os }}/${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      # cosign keyless signing (Linux archives only) mints its OIDC token in
      # this job, right after the archive is built — same step order as
      # Go's release-fcdev.yml, just split across per-platform runners.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Same runner->platform mapping as ci.yml's `native` job:
        # ubuntu-latest = linux/amd64; ubuntu-24.04-arm = linux/arm64 (free
        # for public repositories); macos-latest = darwin/arm64 (Apple
        # silicon, the platform proven by hand). `os`/`arch` here are the
        # exact tokens UpgradeCommand.osName()/archName() produce, since
        # they drive the asset filename below.
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      # Same GraalVM setup as ci.yml's `native` job — reuse its action
      # version, distribution and cache settings rather than inventing new
      # ones.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          cache: maven

      - name: Build fcdev native binary
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mvn -B -q -DskipTests -pl fcdev -am -Pnative package \
            -Dfcdev.vcs.revision=$(git rev-parse HEAD)
          ls -la fcdev/target/fcdev

      # Stage + archive: the binary lives at "<stem>/fcdev" inside the
      # tar.gz (the archive's staging DIRECTORY is tarred, not its
      # contents) — the exact layout UpgradeCommand.nativeAsset()'s
      # innerPath ("<stem>/fcdev") expects, matching Go's release archives.
      #
      # Asset filename derived from UpgradeCommand.nativeAsset()
      # (fcdev/src/main/java/io/flowcatalyst/fcdev/UpgradeCommand.java):
      #   String stem = "fcdev-v" + version + "-" + os + "-" + arch;
      #   return new Asset(stem + "." + ext, stem + "/" + binName);
      # with ext="tar.gz" and binName="fcdev" for every non-Windows os.
      - name: Stage archive
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          stem="fcdev-v${VERSION}-${OS}-${ARCH}"
          mkdir -p "dist/${stem}"
          cp fcdev/target/fcdev "dist/${stem}/fcdev"
          ( cd dist && tar -czf "${stem}.tar.gz" "${stem}" && rm -rf "${stem}" )
          echo "ARCHIVE=${stem}.tar.gz" >> "$GITHUB_ENV"

      - name: Checksum
        run: |
          set -euo pipefail
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      # Cosign keyless signing, Linux archives only — same as Go's
      # release-fcdev.yml. macOS is skipped exactly as Go skips it.
      - name: Install cosign
        if: matrix.os == 'linux'
        uses: sigstore/cosign-installer@v3

      - name: Sign (Linux only)
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --output-signature "$ARCHIVE.sig" \
            --output-certificate "$ARCHIVE.pem" \
            "$ARCHIVE"

      - name: List artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fcdev-release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The JVM fallback. UpgradeCommand.jarAsset() (UpgradeCommand.java:219-221)
  # looks for `fcdev-v<version>.jar` whenever fcdev is running from a jar
  # rather than a native image (UpgradeCommand.java:139 picks the asset by
  # LaunchKind), so a release without it leaves every jar-installed fcdev
  # unable to upgrade: "release <v> has no asset for this platform". Go has
  # no equivalent because it has no JVM build.
  #
  # Platform-independent, so one runner, and no matrix.
  jar:
    name: Build fcdev shaded jar
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build shaded jar
        run: |
          mvn -B -q -DskipTests -pl fcdev -am package \
            -Dfcdev.vcs.revision=$(git rev-parse HEAD)

      # maven-shade-plugin has shadedArtifactAttached=false, so the shaded jar
      # REPLACES the module's main artifact (flowcatalyst-fcdev-<v>.jar) and
      # shade leaves the pre-shade thin jar beside it as original-*.jar.
      # Match on that shape rather than hardcoding the Maven version, which is
      # a SNAPSHOT and unrelated to the release version.
      - name: Stage jar
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          shaded=$(find fcdev/target -maxdepth 1 -name '*.jar' ! -name 'original-*' -print | head -1)
          if [ -z "$shaded" ]; then echo "no shaded jar produced" >&2; exit 1; fi
          echo "shaded jar: $shaded"
          mkdir -p dist
          cp "$shaded" "dist/fcdev-v${VERSION}.jar"
          ( cd dist && sha256sum "fcdev-v${VERSION}.jar" > "fcdev-v${VERSION}.jar.sha256" )

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --output-signature "fcdev-v${VERSION}.jar.sig" \
            --output-certificate "fcdev-v${VERSION}.jar.pem" \
            "fcdev-v${VERSION}.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: fcdev-release-jar
          path: dist/*
          if-no-files-found: error

  # docs/spec/function-developer-surface.md §1 (slice E1): the function-host
  # exec jar, attached beside fcdev's own artifacts as a FIXED name
  # (fc-fnhost.jar — no version in the filename) so `fcdev upgrade` can fetch
  # it "beside the binary" the same way it fetches fcdev itself, and so an
  # older release that predates this job (no fc-fnhost.jar asset) is simply
  # an asset `fcdev upgrade` does not find — never an error (see UpgradeCommand).
  # Platform-independent (a plain jar), so one runner, no matrix — same shape
  # as the `jar` job above.
  fnhost-jar:
    name: Build fc-fnhost exec jar
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build function-host exec jar
        run: |
          mvn -B -q -DskipTests -pl function-host -am package

      # maven-shade-plugin attaches the exec jar with the "exec" classifier
      # (shadedArtifactAttached=true, shadedClassifierName=exec —
      # function-host/pom.xml's fc-fnhost execution) alongside the unshaded
      # main artifact; match on the classifier rather than hardcoding the
      # Maven version, which is a SNAPSHOT and unrelated to the release version.
      - name: Stage fc-fnhost.jar
        run: |
          set -euo pipefail
          exec_jar=$(find function-host/target -maxdepth 1 -name '*-exec.jar' -print | head -1)
          if [ -z "$exec_jar" ]; then echo "no function-host exec jar produced" >&2; exit 1; fi
          echo "exec jar: $exec_jar"
          mkdir -p dist
          cp "$exec_jar" "dist/fc-fnhost.jar"
          ( cd dist && sha256sum "fc-fnhost.jar" > "fc-fnhost.jar.sha256" )

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        run: |
          set -euo pipefail
          cd dist
          cosign sign-blob --yes \
            --output-signature "fc-fnhost.jar.sig" \
            --output-certificate "fc-fnhost.jar.pem" \
            "fc-fnhost.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: fcdev-release-fnhost
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [meta, build, jar, fnhost-jar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: fcdev-release-*
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="fcdev v${VERSION}

          ### Install
          Download the archive for your platform, extract, and put \`fcdev\` on your PATH.

          Available platforms: linux/amd64, linux/arm64, darwin/arm64 (macOS
          Apple silicon). No Windows or Intel-mac build yet.

          A platform-independent \`fcdev-v${VERSION}.jar\` is also published for
          running on a JVM (Java 25+): \`java -jar fcdev-v${VERSION}.jar\`.

          A native \`fcdev\` writing functions locally shells out to a JVM
          function host (\`docs/spec/function-developer-surface.md\` §1); this
          release also publishes \`fc-fnhost.jar\` (a fixed name, no version) —
          \`fcdev upgrade\` fetches it beside the binary automatically.

          ### Verify
          Each archive ships a \`.sha256\` sidecar:
          \`\`\`
          shasum -a 256 -c fcdev-v${VERSION}-<os>-<arch>.tar.gz.sha256
          \`\`\`
          Linux archives are additionally cosign-signed (keyless):
          \`\`\`
          cosign verify-blob \\
            --signature fcdev-v${VERSION}-linux-amd64.tar.gz.sig \\
            --certificate fcdev-v${VERSION}-linux-amd64.tar.gz.pem \\
            --certificate-identity-regexp '^https://github.com/<owner>/<repo>/.github/workflows/release-fcdev.yml@refs/tags/fcdev/v' \\
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\
            fcdev-v${VERSION}-linux-amd64.tar.gz
          \`\`\`"

          # Upload to an existing (e.g. draft) release for this tag, else create one.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "fcdev v${VERSION}" \
              --notes "$NOTES" \
              --verify-tag
          fi
