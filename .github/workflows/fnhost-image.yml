name: fnhost-image

# Weekly (+ on-demand) rebuild of the function-host image (`function-host/Dockerfile`,
# `docs/spec/function-host-process.md` §3): JDK/Alpine base-layer patches land here even
# when nothing in this repo changed — "the one thing a managed Lambda runtime would do
# for us" (docs/spec/function-developer-surface.md §3). Runs `make fnhost-smoke` first
# (packages the fc-fnhost exec jar, then runs it for real, P9 in
# docs/spec/function-host-process.md §4) so a broken host never reaches the image build.
#
# The image is pushed to ECR through GitHub OIDC once the repository variables
# FNHOST_AWS_ROLE_ARN, FNHOST_AWS_REGION and FNHOST_ECR_REPOSITORY are set; until then
# the push steps are skipped and this workflow only builds and smoke-tests.
# Never `mvn install` (CLAUDE.md): `make fnhost-smoke` resolves function-api/server
# through the reactor.

on:
  schedule:
    # Every Monday 03:00 UTC — same shape as a dependency-patch cadence, ahead of the
    # working week so a break is caught with time to fix it before it is needed.
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  MAVEN_OPTS: -Dmaven.repo.local=${{ github.workspace }}/.m2/repository

jobs:
  smoke:
    name: fnhost-smoke (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: fnhost-smoke
        run: make fnhost-smoke

  image:
    name: Build the fc-fnhost image
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GitHub OIDC → the ECR push role
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f function-host/Dockerfile -t flowcatalyst-fnhost:ci .

      # HEALTHCHECK-only smoke: the image needs a real platform to reconcile against
      # to reach /ready=200 (docs/spec/function-host-listener.md §5's "binds only
      # after the first reconcile attempt"), which this job does not stand up — so
      # this only proves the image builds and starts, not that it reconciles.
      - name: Start and probe (build/startup only — no platform to reconcile against)
        run: |
          docker run -d --name fnhost -p 18080:8080 -p 19090:9090 \
            -e FC_FN_PLATFORM_URL=http://127.0.0.1:1 \
            -e FC_FN_CLIENT_ID=smoke \
            -e FC_FN_CLIENT_SECRET=smoke \
            flowcatalyst-fnhost:ci
          sleep 5
          docker logs fnhost
      - name: Stop
        if: always()
        run: docker rm -f fnhost || true

      # Push to ECR (owner ruling R14, docs/spec/function-artifact-upload.md §6). GitHub
      # OIDC assumes the role — no stored keys. Every push step is skipped until the
      # three repository variables are set (docs/deployments.md), so the workflow stays
      # green on a repo that has not been wired to an AWS account yet.
      - name: Configure AWS credentials (GitHub OIDC)
        if: vars.FNHOST_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FNHOST_AWS_ROLE_ARN }}
          aws-region: ${{ vars.FNHOST_AWS_REGION }}
      - name: Log in to ECR
        if: vars.FNHOST_AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push
        if: vars.FNHOST_AWS_ROLE_ARN != ''
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.FNHOST_ECR_REPOSITORY }}
        run: |
          docker tag flowcatalyst-fnhost:ci "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag flowcatalyst-fnhost:ci "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag flowcatalyst-fnhost:ci "$IMAGE:${GITHUB_REF_NAME}"
            docker push "$IMAGE:${GITHUB_REF_NAME}"
          fi
